name: Backend checks
on:
  push:
    branches: [dev/api-safety-tests]
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
